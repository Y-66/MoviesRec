[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moviesrec"
version = "0.1.0"
description = "Movie recommendation data processing project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain == 1.2.14",
    "langgraph == 1.1.4",
    "deepagents == 0.4.12",
    "langchain-openai == 1.1.12",
    "python-dotenv == 1.2.2",
    "fastapi == 0.135.2",
    "uvicorn == 0.42.0",
    "scikit-surprise == 1.1.4",
    "numpy == 1.26.4",
    "pandas == 3.0.2",
    "scikit-learn == 1.8.0",
]
